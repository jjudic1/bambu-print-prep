<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #22a45d; } a:hover { color: #1a8049; }
    .wrap {
      --bg: #101215; --panel: #171a1f; --line: #262b33;
      --ink: #e9ecef; --dim: #949ba6; --accent: #22a45d;
      position: relative;
      width: 620px; height: 780px; background: var(--bg); color: var(--ink);
      font: 500 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; padding: 2rem; box-sizing: border-box;
      text-align: center; overflow: hidden;
    }
    .tag {
      position: absolute; top: 0; left: 0;
      background: #22a45d; color: #06240f;
      font: 800 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .06em; text-transform: uppercase; padding: 7px 10px;
      border-bottom-right-radius: 8px;
    }

    /* --- the stage: four painted sprites on the app's own 13s timeline --- */
    /* Clipped, the way the old viewBox clipped: the hand rests a long way
       below the floor between throws, and without this it is painted straight
       over the heading for three quarters of the loop. */
    .stage { position: relative; width: 544px; height: 186px; overflow: hidden; }
    .stage img { position: absolute; display: block; }

    /* both objects stand on the same implied floor, which also leaves the
       printer's glow somewhere to fall before the clip cuts it */
    .s-ipad    { left: 34px; bottom: 10px; height: 104px; }
    .s-printer { left: 401px; bottom: 8px; height: 158px;
                 animation: a-glow 13s linear infinite; }

    /* the plate copy: wiped upward, the way a print actually grows */
    .s-printed { left: 440px; bottom: 64px; height: 30px;
                 clip-path: inset(100% 0 0 0);
                 animation: a-printed 13s linear infinite; }

    /* paper world on held frames, machine world smooth -- as the line art did */
    .s-plane { left: 0; bottom: 0; height: 34px; transform-origin: 50% 50%;
               opacity: 0; animation: a-plane 13s steps(1, end) infinite; }
    .s-hand  { left: 0; bottom: 0; height: 96px; transform-origin: 78% 30%;
               animation: a-hand 13s steps(1, end) infinite; }

    /* appears above the iPad, is taken, is thrown, flies, is gone */
    @keyframes a-plane {
      0%,   5.9% { opacity: 0; transform: translate(74px, -128px) rotate(-12deg) scale(.55); }
      6%         { opacity: 1; transform: translate(74px, -128px) rotate(-14deg) scale(.55); }
      7.5%       { transform: translate(74px, -130px) rotate(-8deg) scale(1.1); }
      9%         { transform: translate(74px, -128px) rotate(-6deg) scale(1); }
      11%        { transform: translate(74px, -134px) rotate(-3deg) scale(1); }
      13%        { transform: translate(74px, -128px) rotate(-7deg) scale(1); }
      15%        { transform: translate(74px, -132px) rotate(-4deg) scale(1); }
      18%        { transform: translate(75px, -127px) rotate(-6deg) scale(1); }
      20%, 22%   { transform: translate(74px, -125px) rotate(-6deg) scale(1); }
      24%        { transform: translate(58px, -112px) rotate(6deg) scale(1); }
      26%        { transform: translate(50px, -106px) rotate(11deg) scale(1); }
      28%        { transform: translate(86px, -122px) rotate(-6deg) scale(1); }
      30%        { transform: translate(114px, -130px) rotate(-12deg) scale(1); }
      32%        { transform: translate(160px, -140px) rotate(-12deg) scale(1); }
      34%        { transform: translate(206px, -146px) rotate(-8deg) scale(1); }
      36%        { transform: translate(248px, -146px) rotate(-3deg) scale(1); }
      38%        { transform: translate(278px, -138px) rotate(-8deg) scale(1); }
      40%        { transform: translate(310px, -148px) rotate(-60deg) scale(1); }
      42%        { transform: translate(338px, -138px) rotate(-130deg) scale(1); }
      44%        { transform: translate(350px, -112px) rotate(-200deg) scale(1); }
      46%        { transform: translate(328px, -92px) rotate(-270deg) scale(1); }
      48%        { transform: translate(300px, -102px) rotate(-330deg) scale(1); }
      50%        { transform: translate(295px, -126px) rotate(-366deg) scale(1); }
      52%        { transform: translate(348px, -130px) rotate(-366deg) scale(1); }
      54%        { transform: translate(390px, -118px) rotate(-360deg) scale(1); }
      56%        { transform: translate(415px, -100px) rotate(-356deg) scale(1); }
      58%        { transform: translate(428px, -82px) rotate(-352deg) scale(1); }
      59.5%      { transform: translate(434px, -70px) rotate(-348deg) scale(1); }
      60%        { opacity: 1; transform: translate(436px, -62px) rotate(-346deg) scale(.8); }
      60.4%, 100% { opacity: 0; transform: translate(436px, -62px) rotate(-346deg) scale(.6); }
    }

    /* up from below, pinch, wind, throw, gone. Origin is the pinch itself. */
    @keyframes a-hand {
      0%,  13.9% { transform: translate(10px, 150px) rotate(0deg); }
      14%        { transform: translate(14px, 140px) rotate(-4deg); }
      16%        { transform: translate(16px, 80px) rotate(-6deg); }
      18%        { transform: translate(14px, 10px) rotate(-8deg); }
      20%        { transform: translate(8px, -46px) rotate(-10deg); }
      22%        { transform: translate(2px, -74px) rotate(-8deg); }
      24%        { transform: translate(-14px, -58px) rotate(4deg); }
      26%        { transform: translate(-22px, -50px) rotate(9deg); }
      28%        { transform: translate(14px, -68px) rotate(-8deg); }
      30%        { transform: translate(44px, -78px) rotate(-14deg); }
      32%        { transform: translate(30px, -30px) rotate(-6deg); }
      34%        { transform: translate(18px, 40px) rotate(-2deg); }
      36%        { transform: translate(12px, 110px) rotate(0deg); }
      38%, 100%  { transform: translate(10px, 150px) rotate(0deg); }
    }

    /* it lands: the machine takes the colour for a moment */
    @keyframes a-glow {
      0%,  59.9% { filter: none; }
      60.5%      { filter: drop-shadow(0 0 14px rgba(34, 164, 93, .95)); }
      67%        { filter: drop-shadow(0 0 7px rgba(34, 164, 93, .55)); }
      73%        { filter: drop-shadow(0 0 11px rgba(34, 164, 93, .8)); }
      86%, 100%  { filter: none; }
    }

    /* then it prints it, growing off the plate a layer at a time */
    @keyframes a-printed {
      0%,  66%    { clip-path: inset(100% 0 0 0); opacity: 1; }
      92%, 97%    { clip-path: inset(0 0 0 0); opacity: 1; }
      99.5%, 100% { clip-path: inset(0 0 0 0); opacity: 0; }
    }

    /* asked to stop moving things, it holds the last frame: the plane, printed */
    @media (prefers-reduced-motion: reduce) {
      .s-plane, .s-hand, .s-printer, .s-printed { animation: none; }
      .s-plane, .s-hand { opacity: 0; }
      .s-printed { clip-path: inset(0 0 0 0); }
    }

    h1 { font-size: 2.4rem; margin: 0; letter-spacing: -.02em; font-weight: 800; }
    .tagline { margin: .15rem 0 .6rem; color: #22a45d; font-size: .95rem;
               font-weight: 600; letter-spacing: .01em; }
    .lede { color: #949ba6; max-width: 28rem; margin: 0; text-wrap: pretty; }
    .drop { margin-top: 1rem; padding: 2.5rem 3rem; border: 2px dashed #262b33;
            border-radius: 18px; background: #171a1f; }
    .drop span { color: #22a45d; font-weight: 700; }
    .hint { color: #949ba6; font-size: .82rem; margin: .6rem 0 0; }
  </style>
</helmet>
<div class="wrap">
  <div class="tag">A A &middot; layered spritesmiddot; layered sprites</div>

  <div class="stage">
    <img class="s-ipad" src="ipad.webp" alt="">
    <img class="s-printer" src="printer.webp" alt="">
    <img class="s-printed" src="plane.webp" alt="">
    <img class="s-hand" src="hand.webp" alt="">
    <img class="s-plane" src="plane.webp" alt="">
  </div>

  <h1>Handoff3D</h1>
  <p class="tagline">3D print&hellip; no computer necessary</p>
  <p class="lede">
    Bring a model. We&rsquo;ll work out which way up it goes and how big it
    should be, and hand you a file your printer understands.
  </p>
  <div class="drop"><span>Choose a model</span></div>
  <p class="hint">STL, 3MF, OBJ, GLB or PLY.</p>
</div>
</x-dc>
</body>
</html>
