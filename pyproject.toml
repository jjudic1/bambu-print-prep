[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "print-prep"
version = "0.1.0"
description = "Mesh in, print-ready project 3mf out."
requires-python = ">=3.12"

[project.scripts]
prep = "prep.cli:main"

[tool.setuptools]
packages = ["prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
